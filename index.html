<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>MCC Deal Desk</title>
<style>
:root{
  --blue:#4E7B96; --blue-mid:#6B9AB3; --blue-light:#D4E4EE; --blue-pale:#EFF5F8;
  --gray:#9BAAB5; --ink:#2C3E50; --white:#fff;
  --ink-2:#5A6B7B; --ink-3:#8494A2;
  --line:#DDE6EC; --line-2:#EDF2F6;
  --bg:#F6F9FB;
  --good:#2F6B52; --good-bg:#E4F0EA;
  --warn:#9A6A16; --warn-bg:#FBF0DC;
  --crit:#A33A32; --crit-bg:#FAE7E5;
  --radius:10px;
  --shadow:0 1px 2px rgba(44,62,80,.06), 0 4px 12px rgba(44,62,80,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial, Calibri, "Helvetica Neue", Helvetica, sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}

/* ---------- GATE ---------- */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#4E7B96 0%,#3A6076 55%,#2C4A5C 100%);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:24px}
.gate-card{background:#fff;border-radius:14px;padding:38px 34px;width:100%;max-width:390px;
  box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center}
.gate-card img{height:74px;margin-bottom:6px}
.gate-card .tag{font-size:11px;color:var(--gray);font-style:italic;letter-spacing:.03em;margin-bottom:26px}
.gate-card h1{font-size:16px;margin:0 0 4px;color:var(--ink);letter-spacing:.01em}
.gate-card .sub{font-size:12px;color:var(--ink-3);margin-bottom:22px}
#pw{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;font-size:15px;
  text-align:center;letter-spacing:.05em;outline:none;transition:border-color .15s}
#pw:focus{border-color:var(--blue)}
#gate button{width:100%;margin-top:12px;padding:12px;background:var(--blue);color:#fff;border:none;
  border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;transition:background .15s}
#gate button:hover{background:#3F6A82}
#gate button:disabled{opacity:.6;cursor:default}
#gate-err{color:var(--crit);font-size:12px;margin-top:12px;min-height:16px}
.gate-note{font-size:10.5px;color:var(--ink-3);margin-top:20px;line-height:1.5}

/* ---------- SHELL ---------- */
#app{display:none}
header{background:#fff;border-bottom:1px solid var(--line);padding:0 22px;
  display:flex;align-items:center;gap:18px;height:60px;position:sticky;top:0;z-index:40}
header img{height:36px}
.brandtxt{line-height:1.15}
.brandtxt b{font-size:14px;letter-spacing:.02em}
.brandtxt span{font-size:10px;color:var(--gray);font-style:italic;display:block}
nav{display:flex;gap:2px;margin-left:14px;flex:1}
nav button{background:none;border:none;padding:8px 14px;font-size:13px;color:var(--ink-2);
  cursor:pointer;border-radius:7px;transition:.13s;white-space:nowrap}
nav button:hover{background:var(--blue-pale);color:var(--blue)}
nav button.on{background:var(--blue);color:#fff;font-weight:bold}
.hsearch{position:relative}
.hsearch input{padding:8px 12px 8px 30px;border:1px solid var(--line);border-radius:7px;font-size:13px;
  width:210px;outline:none;background:var(--bg)}
.hsearch input:focus{border-color:var(--blue-mid);background:#fff}
.hsearch svg{position:absolute;left:9px;top:9px;opacity:.4}
main{padding:20px 22px 60px;max-width:1680px;margin:0 auto}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:5px}
.kpi .val{font-size:23px;font-weight:bold;color:var(--ink);line-height:1.1;letter-spacing:-.01em}
.kpi .sub{font-size:11px;color:var(--ink-3);margin-top:3px}
.kpi.alert{border-color:#E8C4C0;background:linear-gradient(#FEF8F7,#fff)}
.kpi.alert .val{color:var(--crit)}

/* ---------- BOARD ---------- */
.board{display:flex;gap:13px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 262px;background:#EEF3F7;border-radius:var(--radius);border:1px solid var(--line-2)}
.col-h{padding:11px 13px 9px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #E2EAF0}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.col-h b{font-size:12px;flex:1;letter-spacing:.01em}
.col-h .ct{font-size:11px;color:var(--ink-3);background:#fff;border-radius:20px;padding:1px 8px;border:1px solid var(--line)}
.col-amt{padding:0 13px 9px;font-size:10.5px;color:var(--ink-3);border-bottom:1px solid #E2EAF0}
.col-b{padding:9px;display:flex;flex-direction:column;gap:8px;min-height:44px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;
  transition:.13s;box-shadow:0 1px 2px rgba(44,62,80,.05)}
.card:hover{border-color:var(--blue-mid);box-shadow:0 3px 10px rgba(78,123,150,.16);transform:translateY(-1px)}
.card .nm{font-size:12.5px;font-weight:bold;line-height:1.3;margin-bottom:5px}
.card .amt{font-size:12px;color:var(--blue);font-weight:bold}
.card .amt em{font-style:normal;color:var(--ink-3);font-weight:normal;font-size:11px}
.card .sp{font-size:11px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{font-size:9.5px;background:var(--blue-pale);color:var(--blue);border:1px solid #DCE8F0;
  border-radius:4px;padding:1.5px 6px;white-space:nowrap}
.chip.miss{background:#F3F5F7;color:var(--ink-3);border-color:var(--line);font-style:italic}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;border-radius:4px;padding:2px 6px;
  margin-top:7px;font-weight:bold}
.flag.crit{background:var(--crit-bg);color:var(--crit)}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.col-more{font-size:10.5px;color:var(--ink-3);text-align:center;padding:7px 9px 11px;font-style:italic;line-height:1.4}

/* ---------- TABLES ---------- */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;margin-bottom:18px}
.panel-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel-h b{font-size:13.5px}
.panel-h .note{font-size:11px;color:var(--ink-3);margin-left:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--blue-mid);color:#fff;font-size:10.5px;text-align:left;padding:8px 12px;
  font-weight:bold;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid var(--line-2);vertical-align:top}
tbody tr:nth-child(even){background:var(--blue-pale)}
tbody tr.clk{cursor:pointer}
tbody tr.clk:hover{background:var(--blue-light)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sect-row td{background:var(--blue-light)!important;color:var(--blue);font-weight:bold;font-size:11px;
  text-transform:uppercase;letter-spacing:.05em;padding:6px 12px}

/* ---------- BADGES ---------- */
.badge{display:inline-block;font-size:10px;border-radius:4px;padding:2px 7px;font-weight:bold;white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-crit{background:var(--crit-bg);color:var(--crit)}
.b-neut{background:#EDF1F4;color:var(--ink-2)}
.who{display:inline-flex;align-items:center;gap:5px;font-size:11.5px}
.av{width:21px;height:21px;border-radius:50%;background:var(--blue);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}
.av.kyle{background:#5B6BA8}.av.davis{background:#C8873E}

/* ---------- BARS ---------- */
.barrow{display:flex;align-items:center;gap:10px;padding:5px 0}
.barrow .bl{font-size:11.5px;width:150px;flex:none;color:var(--ink-2)}
.bartrack{flex:1;height:15px;background:var(--line-2);border-radius:3px;overflow:hidden}
.barfill{height:100%;border-radius:0 4px 4px 0;background:var(--blue)}
.barrow .bv{font-size:11.5px;width:90px;text-align:right;flex:none;font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- DRAWER ---------- */
#scrim{position:fixed;inset:0;background:rgba(30,45,58,.42);z-index:60;display:none}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(720px,94vw);background:#fff;z-index:70;
  display:none;flex-direction:column;box-shadow:-8px 0 34px rgba(0,0,0,.2)}
.dw-h{background:var(--blue);color:#fff;padding:16px 20px;flex:none}
.dw-h .t{font-size:16px;font-weight:bold;padding-right:34px;line-height:1.25}
.dw-h .m{font-size:11.5px;opacity:.9;margin-top:5px}
.dw-x{position:absolute;top:13px;right:15px;background:rgba(255,255,255,.15);border:none;color:#fff;
  width:28px;height:28px;border-radius:6px;font-size:17px;cursor:pointer;line-height:1}
.dw-x:hover{background:rgba(255,255,255,.28)}
.dw-tabs{display:flex;background:#F2F6F9;border-bottom:1px solid var(--line);flex:none;overflow-x:auto}
.dw-tabs button{background:none;border:none;padding:10px 15px;font-size:12px;cursor:pointer;color:var(--ink-2);
  border-bottom:2.5px solid transparent;white-space:nowrap}
.dw-tabs button.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:bold;background:#fff}
.dw-b{flex:1;overflow-y:auto;padding:18px 20px 40px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin-bottom:18px}
.fact{background:var(--blue-pale);border:1px solid #E3EDF3;border-radius:7px;padding:9px 11px}
.fact .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:3px}
.fact .v{font-size:14px;font-weight:bold}
.fact .v.none{color:var(--ink-3);font-weight:normal;font-style:italic;font-size:12.5px}
h4.sh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--blue);
  background:var(--blue-light);padding:5px 10px;border-radius:5px;margin:20px 0 11px}
h4.sh:first-child{margin-top:0}
.email{border:1px solid var(--line);border-left:3px solid var(--blue-mid);border-radius:7px;padding:11px 13px;margin-bottom:10px;background:#fff}
.email.hi{border-left-color:var(--crit);background:#FEFAF9}
.email .eh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:5px}
.email .en{font-weight:bold;font-size:12.5px}
.email .eo{font-size:11px;color:var(--ink-3)}
.email .ed{font-size:11px;color:var(--ink-3);margin-left:auto}
.email .es{font-size:12px;color:var(--ink-2);font-style:italic;margin-bottom:6px}
.email .ea{font-size:12.5px;background:var(--blue-pale);border-radius:5px;padding:8px 10px}
.email .ea b{color:var(--blue);font-size:10px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.tk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.tk:last-child{border-bottom:none}
.tk .box{width:15px;height:15px;border:1.5px solid var(--gray);border-radius:3.5px;flex:none;margin-top:2px}
.tk .tx{flex:1;font-size:12.5px}
.tk .mt{font-size:10.5px;color:var(--ink-3);margin-top:3px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.note-box{background:#FBFCFD;border:1px solid var(--line);border-radius:7px;padding:11px 13px;font-size:12.5px;
  color:var(--ink-2);line-height:1.55}
.empty{text-align:center;padding:26px 16px;color:var(--ink-3);font-size:12.5px;font-style:italic}
.lbtn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:12px;
  cursor:pointer;color:var(--ink-2);margin-right:6px;text-decoration:none;display:inline-block}
.lbtn:hover{border-color:var(--blue-mid);color:var(--blue)}
.lbtn.go{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:bold;padding:9px 16px;font-size:13px}
.lbtn.go:hover{background:#3F6A82;color:#fff}
.lchk{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
nav button.newbtn{background:var(--good);color:#fff;font-weight:bold;margin-left:6px}
nav button.newbtn:hover{background:#26563F;color:#fff}
nav button.newbtn.on{background:var(--good)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:13px}
.fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;
  font-size:13px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue-mid)}
.fld.req label:after{content:" *";color:var(--crit)}
.fld.wide{grid-column:1/-1}
.fld textarea{min-height:74px;resize:vertical}
.actbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.drafts{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.draft{background:var(--blue-pale);border:1px solid #DCE8F0;border-radius:5px;padding:3px 9px;font-size:11.5px;color:var(--blue)}
.banner{border-radius:8px;padding:11px 14px;font-size:12.5px;margin-bottom:16px;line-height:1.5}
.banner.crit{background:var(--crit-bg);border:1px solid #EDC7C3;color:#7C2B25}
.banner.info{background:var(--blue-pale);border:1px solid #D5E5EF;color:#3A6076}
.banner b{display:block;margin-bottom:2px}
footer{text-align:center;font-size:10.5px;color:var(--ink-3);padding:22px 16px 34px;line-height:1.6}
@media(max-width:820px){
  header{height:auto;flex-wrap:wrap;padding:10px 14px;gap:10px}
  nav{order:3;width:100%;overflow-x:auto;margin-left:0}
  .hsearch input{width:150px}
  main{padding:14px 12px 50px}
  #drawer{width:100vw}
}
</style>
</head>

let D=null, VIEW="board", Q="", CUR=null, DTAB="overview";
const TODAY=new Date("2026-08-17T12:00:00");

/* ---------- crypto ---------- */
async function unlock(pass){
  const raw=Uint8Array.from(atob(PAYLOAD),c=>c.charCodeAt(0));
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function money(n){
  if(n==null) return null;
  if(n>=1e6) return "$"+(n/1e6).toFixed(n%1e6===0?0:2).replace(/\.?0+$/,"")+"M";
  if(n>=1e3) return "$"+Math.round(n/1e3)+"K";
  return "$"+n.toLocaleString();
}
const days=d=>d?Math.round((TODAY-new Date(d+"T12:00:00"))/864e5):null;
const stage=id=>D.stages.find(s=>s.id===id)||{name:id,color:"#9BAAB5"};
const person=id=>D.team.find(t=>t.id===id)||{name:id||"Unassigned",initials:"?"};
function who(id){const p=person(id);return `<span class="who"><span class="av ${esc(id)}">${esc(p.initials)}</span>${esc(p.name.split(" ")[0])}</span>`;}
function taskState(t){
  if(t.status==="done") return {c:"b-good",l:"Done"};
  const dd=days(t.due);
  if(dd!=null&&dd>0) return {c:"b-crit",l:"Overdue "+dd+"d"};
  if(dd!=null&&dd>=-2) return {c:"b-warn",l:"Due soon"};
  return {c:"b-neut",l:"Open"};
}
const allTasks=()=>D.deals.flatMap(d=>(d.tasks||[]).map(t=>({...t,deal:d.name,dealId:d.id})));
const openTasks=()=>allTasks().filter(t=>t.status!=="done");
const overdue=()=>openTasks().filter(t=>{const dd=days(t.due);return dd!=null&&dd>0;});
const isStale=d=>{
  if(["closed"].includes(d.stage)) return false;
  const ds=(d.emails||[]).map(e=>days(e.date)).concat((d.lenders||[]).map(l=>days(l.updated))).filter(x=>x!=null);
  return ds.length?Math.min(...ds)>45:false;
};
const staleDays=d=>{
  const ds=(d.emails||[]).map(e=>days(e.date)).concat((d.lenders||[]).map(l=>days(l.updated))).filter(x=>x!=null);
  return ds.length?Math.min(...ds):null;
};
const leadDue=l=>{const dd=days(l.lastContact);return dd!=null&&dd>=(l.cadenceDays||30);};
function match(d){
  if(!Q) return true;
  const s=Q.toLowerCase();
  return [d.name,d.sponsor,d.city,d.state,d.assetType,d.loanType,d.txnType].filter(Boolean)
    .some(v=>String(v).toLowerCase().includes(s));
}
const volume=()=>D.deals.filter(d=>!["closed"].includes(d.stage)&&!d.amountSuspect&&!d.dupSuspect)
  .reduce((a,d)=>a+(d.amount||0),0);
const dups=()=>D.deals.filter(d=>d.dupSuspect);

/* ---------- KPIs ---------- */
function kpis(){
  const active=D.deals.filter(d=>d.stage!=="closed");
  const noAmt=active.filter(d=>d.amount==null).length;
  const stales=D.deals.filter(isStale).length;
  const od=overdue().length;
  const leadsDue=D.leads.filter(leadDue).length;
  const dp=dups().length;
  $("#kpis").innerHTML=[
    ["Active pipeline",money(volume()),active.length+" open deals, net of duplicates"],
    ["Loaded from LEV",D.meta.loadedCount+" of "+D.meta.totalCount,"4 of 6 columns fully imported"],
    ["Overdue tasks",od,od?"oldest is "+Math.max(...overdue().map(t=>days(t.due)))+" days past due":"nothing past due",od>0],
    ["Stalled deals",stales,stales?"no lender contact in 45+ days":"all deals recently touched",stales>0],
    ["Possible duplicates",dp,dp?"held out of volume until confirmed":"none flagged",dp>0],
    ["Leads due a touch",leadsDue,"30-day cadence",leadsDue>0],
    ["Deals missing an amount",noAmt,"cannot be sized or sent out",noAmt>0]
  ].map(([l,v,s,a])=>`<div class="kpi${a?" alert":""}"><div class="lbl">${esc(l)}</div>
      <div class="val">${esc(v)}</div><div class="sub">${esc(s)}</div></div>`).join("");
}

/* ---------- BOARD ---------- */
function vBoard(){
  const cols=D.stages.map(s=>{
    const ds=D.deals.filter(d=>d.stage===s.id&&match(d));
    const tot=D.meta.stageTotals[s.id]||ds.length;
    const vol=ds.filter(d=>!d.amountSuspect).reduce((a,d)=>a+(d.amount||0),0);
    const hidden=tot-D.deals.filter(d=>d.stage===s.id).length;
    return `<div class="col">
      <div class="col-h"><span class="dot" style="background:${s.color}"></span>
        <b>${esc(s.name)}</b><span class="ct">${tot}</span></div>
      <div class="col-amt">${vol?esc(money(vol))+" loaded":"&mdash;"}</div>
      <div class="col-b">${ds.map(card).join("")||'<div class="empty" style="padding:14px">No match</div>'}</div>
      ${hidden>0?`<div class="col-more">+${hidden} more not yet imported from LEV</div>`:""}
    </div>`;
  }).join("");
  return `<div class="board">${cols}</div>`;
}
function card(d){
  const st=isStale(d), od=(d.tasks||[]).filter(t=>{const dd=days(t.due);return t.status!=="done"&&dd!=null&&dd>0;}).length;
  return `<div class="card" data-id="${esc(d.id)}">
    <div class="nm">${esc(d.name)}</div>
    <div class="amt">${d.amount!=null?esc(money(d.amount))+(d.amountSuspect?' <em>&#9888; verify</em>':""):'<em>amount not set</em>'}
      ${d.loanType?`<em> &middot; ${esc(d.loanType)}${d.txnType?" "+esc(d.txnType):""}</em>`:""}</div>
    ${d.sponsor?`<div class="sp">${esc(d.sponsor)}</div>`:'<div class="sp muted"><em>no sponsor on file</em></div>'}
    <div class="chips">
      ${d.assetType?`<span class="chip">${esc(d.assetType)}</span>`:'<span class="chip miss">property type</span>'}
      ${d.city?`<span class="chip">${esc(d.city)}, ${esc(d.state)}</span>`:'<span class="chip miss">address</span>'}
    </div>
    ${d.dupSuspect?`<div class="flag warn">&#9679; Possible duplicate record</div>`:""}
    ${st?`<div class="flag crit">&#9679; No lender contact in ${staleDays(d)} days</div>`:""}
    ${od?`<div class="flag warn">&#9679; ${od} overdue task${od>1?"s":""}</div>`:""}
  </div>`;
}

/* ---------- ALL DEALS ---------- */
function vDeals(){
  const rows=D.stages.map(s=>{
    const ds=D.deals.filter(d=>d.stage===s.id&&match(d));
    if(!ds.length) return "";
    return `<tr class="sect-row"><td colspan="7">${esc(s.name)} &middot; ${ds.length} loaded of ${D.meta.stageTotals[s.id]}</td></tr>`+
      ds.map(d=>`<tr class="clk" data-id="${esc(d.id)}">
        <td><b>${esc(d.name)}</b>${isStale(d)?' <span class="badge b-crit">stalled</span>':""}${d.dupSuspect?' <span class="badge b-warn">duplicate?</span>':""}</td>
        <td class="num">${d.amount!=null?esc(money(d.amount)):'<span class="muted">&mdash;</span>'}${d.amountSuspect?' <span class="badge b-warn">verify</span>':""}</td>
        <td>${d.loanType?esc(d.loanType):'<span class="muted">&mdash;</span>'}${d.txnType?" &middot; "+esc(d.txnType):""}</td>
        <td>${d.sponsor?esc(d.sponsor):'<span class="muted">&mdash;</span>'}</td>
        <td>${d.assetType?esc(d.assetType):'<span class="muted">&mdash;</span>'}</td>
        <td>${d.city?esc(d.city)+", "+esc(d.state):'<span class="muted">&mdash;</span>'}</td>
        <td>${who(d.owner)}</td></tr>`).join("");
  }).join("");
  const byStage=D.stages.map(s=>{
    const v=D.deals.filter(d=>d.stage===s.id&&!d.amountSuspect).reduce((a,d)=>a+(d.amount||0),0);
    return {n:s.name,v,c:D.meta.stageTotals[s.id]};
  });
  const mx=Math.max(...byStage.map(b=>b.v),1);
  return `<div class="panel"><div class="panel-h"><b>Loaded volume by stage</b>
      <span class="note">Bars reflect the ${D.meta.loadedCount} deals imported so far, not all ${D.meta.totalCount}</span></div>
    <div style="padding:14px 16px">${byStage.map(b=>`<div class="barrow">
      <div class="bl">${esc(b.n)} <span class="muted">(${b.c})</span></div>
      <div class="bartrack"><div class="barfill" style="width:${(b.v/mx*100).toFixed(1)}%"></div></div>
      <div class="bv">${b.v?esc(money(b.v)):"&mdash;"}</div></div>`).join("")}</div></div>
    <div class="panel"><div class="panel-h"><b>All deals</b><span class="note">Click any row for detail</span></div>
    <table><thead><tr><th>Deal</th><th style="text-align:right">Amount</th><th>Type</th>
      <th>Sponsor</th><th>Asset</th><th>Market</th><th>Owner</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7" class="empty">No deals match your search.</td></tr>'}</tbody></table></div>`;
}

const F=[

function wireNew(){
  const read=()=>{const o={};F.forEach(([k])=>{const e=$("#f_"+k); if(e) o[k]=e.value.trim();}); return o;};
  const num=s=>{const n=parseFloat(String(s||"").replace(/[^0-9.]/g,"")); return isFinite(n)&&n>0?n:null;};
  const save=stage=>{
    const o=read();
    const miss=F.filter(([k,l,t,r])=>r&&!o[k]).map(([k,l])=>l);
    if(miss.length){$("#fmsg").innerHTML=`<span style="color:var(--crit)">Missing: ${esc(miss.join(", "))}</span>`;return;}
    o.stage=stage; o.amountNum=num(o.amount); o.created=new Date().toISOString().slice(0,10);
    const drafts=store.get(); drafts.push(o); store.set(drafts);
    const block="```mcc-new-deal\n"+JSON.stringify(o,null,2)+"\n```";
    const isLaunch=stage==="lenders";
    $("#fout").innerHTML=`<h4 class="sh">${isLaunch?"Ready to launch":"Saved as a lead"}</h4>
      <div class="banner ${isLaunch?"crit":"info"}">
        <b>${esc(o.name)} &mdash; ${o.amountNum?esc(money(o.amountNum)):esc(o.amount)} ${esc(o.loanType)} ${esc(o.txnType)}</b>
        ${isLaunch?"Paste the block below into our chat and I'll build the teaser, pick the lender list, and put it on the board in Reaching Out To Lenders."
                  :"Paste the block below into our chat and I'll add it to the Lead column with a 30-day touch-base clock."}</div>
      <div class="note-box" style="white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;max-height:280px;overflow:auto">${esc(block)}</div>
      <div class="actbar"><button class="lbtn go" id="ocopy">Copy for Claude</button>
        <a class="lbtn" id="omail" href="#">Email it to myself</a></div>`;
    const copy=t=>{navigator.clipboard.writeText(t).then(()=>{$("#fmsg").innerHTML='<span style="color:var(--good)">Copied — paste it into Claude.</span>';});};
    $("#ocopy").onclick=()=>copy(block);
    $("#omail").href=`mailto:evan@middlecreekcapital.com?subject=${encodeURIComponent("New deal: "+o.name)}&body=${encodeURIComponent(block)}`;
    $("#fmsg").innerHTML=`<span style="color:var(--good)">Saved locally. ${store.get().length} draft(s) pending.</span>`;
    window.scrollTo(0,document.body.scrollHeight);
  };
  $("#saveLead").onclick=()=>save("lead");
  $("#saveLaunch").onclick=()=>save("lenders");
  $("#fclear").onclick=()=>{F.forEach(([k])=>{const e=$("#f_"+k); if(e&&e.tagName!=="SELECT") e.value="";});$("#fmsg").textContent="";$("#fout").innerHTML="";};
  const dc=$("#dcopy");
  if(dc){
    const all="```mcc-new-deals\n"+JSON.stringify(store.get(),null,2)+"\n```";
    dc.onclick=()=>navigator.clipboard.writeText(all).then(()=>{dc.textContent="Copied ✓";});
    $("#ddl").onclick=()=>{const b=new Blob([JSON.stringify(store.get(),null,2)],{type:"application/json"});
      const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="mcc-new-deals.json";a.click();};
    $("#dclr").onclick=()=>{store.set([]);render();};
  }
}

function wireLaunch(d){
  const roster=(D.lenderRoster||{})[d.launchList||"sba7a"]||[];
  const chks=()=>[...document.querySelectorAll(".lchk")];
  const count=()=>{const n=chks().filter(c=>c.checked).length;
    $("#lcount").textContent=n+" lender"+(n===1?"":"s")+" selected";};
  chks().forEach(c=>c.onchange=count); count();
  $("#lsel").onclick=()=>{chks().forEach(c=>c.checked=true);count();};
  $("#lclr").onclick=()=>{chks().forEach(c=>c.checked=false);count();};
  $("#lgo").onclick=()=>{
    const picked=chks().filter(c=>c.checked).map(c=>roster[+c.dataset.i]);
    if(!picked.length){$("#lout").innerHTML='<div class="banner crit">Pick at least one lender.</div>';return;}
    const amt=d.amount!=null?money(d.amount):"[LOAN AMOUNT]";
    const subj=`${d.loanType||"Financing"} Request | ${d.txnType||""} | ${d.sponsor||d.name}`.replace(/\s+\|\s*$/,"");
    const body=[
      `Hope all is well! Wanted to shoot this over and see if it's in your wheelhouse.`,``,
      `We're working with ${d.sponsor||"[SPONSOR]"} on a ${amt} ${(d.loanType||"").toLowerCase()} ${(d.txnType||"request").toLowerCase()}`
        +`${d.assetType?` — ${d.assetType.toLowerCase()}`:""}${d.city?` in ${d.city}, ${d.state}`:""}.`,``,
      `[DEAL SUMMARY — revenue, EBITDA, DSCR, use of proceeds]`,``,
      `The Offering Memorandum is attached and the full data room is available on request. Happy to jump on a quick call`,
      `if you want to talk through it — just let me know if this fits your appetite.`,``,
      `Best,`,``,`Evan Cannon`,`Middle Creek Capital, LLC`,`evan@middlecreekcapital.com`
    ].join("\n");
    const bcc=picked.map(p=>p.email).filter(Boolean);
    const noEmail=picked.filter(p=>!p.email);
    const href=`mailto:?bcc=${encodeURIComponent(bcc.join(","))}`
      +`&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
    $("#lout").innerHTML=`<h4 class="sh">Ready to send &mdash; ${picked.length} lenders</h4>
      <div class="note-box" style="white-space:pre-wrap;font-size:12px"><b>Subject:</b> ${esc(subj)}\n\n${esc(body)}</div>
      <div style="margin-top:12px"><a class="lbtn go" href="${href}">Open in my mail client</a></div>
      ${noEmail.length?`<div class="banner crit" style="margin-top:12px"><b>${noEmail.length} of these have no email on file.</b>
        ${esc(noEmail.map(p=>p.name).join(", "))} — ask me to find their contact and I'll add it.</div>`:""}
      <div class="banner info" style="margin-top:12px">Bracketed placeholders are intentional. Tell me the deal numbers
      and I'll write the real pitch, then this button sends the finished version.</div>`;
  };
}

/* ---------- RENDER ---------- */
function render(){
  kpis();
  $("#view").innerHTML={board:vBoard,deals:vDeals,lenders:vLenders,tasks:vTasks,leads:vLeads,new:vNew}[VIEW]();
  if(VIEW==="new") wireNew();
  document.querySelectorAll("[data-id]").forEach(el=>el.onclick=()=>openDeal(el.dataset.id));
  $("#foot").innerHTML=`Middle Creek Capital &middot; Deal Desk &middot; Data as of ${esc(D.meta.generated)}<br>
    ${esc(D.meta.source)}`;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); VIEW=b.dataset.v; render();
});
$("#q").oninput=e=>{Q=e.target.value.trim();render();};
$("#dw-x").onclick=closeDrawer; $("#scrim").onclick=closeDrawer;
$("#dw-tabs").onclick=e=>{if(e.target.dataset.t){DTAB=e.target.dataset.t;
  document.querySelectorAll("#dw-tabs button").forEach(x=>x.classList.remove("on"));
  e.target.classList.add("on"); drawBody();}};
document.onkeydown=e=>{if(e.key==="Escape")closeDrawer();};

$("#gform").onsubmit=async e=>{
  e.preventDefault();
  const btn=$("#gbtn"); btn.disabled=true; btn.textContent="Unlocking…"; $("#gate-err").textContent="";
  try{
    D=await unlock($("#pw").value);
    $("#gate").style.display="none"; $("#app").style.display="block"; render();
  }catch(err){
    $("#gate-err").textContent="That password didn't work. Try again.";
    btn.disabled=false; btn.textContent="Unlock"; $("#pw").value=""; $("#pw").focus();
  }
};
</script>
</body>
</html>
